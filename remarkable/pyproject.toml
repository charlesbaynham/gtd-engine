[project]
name = "gtd-remarkable"
version = "1.0.0"
description = "reMarkable paper round-trip for the GTD vault: sheet out, handwritten decisions back in"
requires-python = ">=3.11"
dependencies = [
    "gtd-ci",
    "gtd-mcp",
]

[project.optional-dependencies]
# The device / vision half. Installed from GitHub in CI; not needed to run
# the vault-side tests.
device = ["remarkable-gtd @ git+https://github.com/charlesbaynham/remarkable-gtd@a224d011b54e590e0ef6a4858b35f04d4ed958e7"]
test = ["pytest>=7", "pyyaml>=6"]

[project.scripts]
gtd-remarkable = "gtd_remarkable.cli:main"

[tool.setuptools.packages.find]
include = ["gtd_remarkable*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
