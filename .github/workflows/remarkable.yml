# Reusable reMarkable round-trip: read back yesterday's handwritten sheet,
# apply the decisions, push, then render and upload today's sheet. Mirrors
# the GitLab `remarkable` job in gitlab/vault.gitlab-ci.yml. Called by a
# vault's thin .github/workflows/remarkable.yml — see README.md.
name: reMarkable round-trip

on:
  workflow_call:
    inputs:
      vault_tz:
        type: string
        default: Europe/London
      remarkable_folder:
        type: string
        default: "GTD Daily"
      remarkable_archive_folder:
        description: Defaults to "<remarkable_folder>/Archive" (gtd_remarkable's own default) when unset.
        type: string
        default: ""
      remarkable_keep_days:
        type: string
        default: "3"
      remarkable_max_pending:
        description: How many un-written sheets may sit on the device before publish stops adding more. Minimum 1.
        type: string
        default: "1"
      openrouter_model:
        type: string
        default: ""
      openrouter_ai_model:
        type: string
        default: ""
      openrouter_reasoning:
        type: string
        default: ""
      openrouter_read_reasoning:
        type: string
        default: ""
      remarkable_gtd_ref:
        description: Overrides the remarkable-gtd commit pinned by gtd-remarkable's [device] extra.
        type: string
        default: ""
    secrets:
      RMAPI_DEVICE_TOKEN:
        required: true
      OPENROUTER_API_KEY:
        required: true

# The engine ref every install below uses. Same major as the tag vaults call
# this file by, so the workflow and the code it installs move together —
# github.job_workflow_sha would be exact but is empty on a tag reference.
env:
  GTD_ENGINE_REF: v2

permissions:
  contents: write

jobs:
  remarkable:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.56.0-noble
    concurrency:
      group: gtd-maintenance
      cancel-in-progress: false
    env:
      RMAPI_DEVICE_TOKEN: ${{ secrets.RMAPI_DEVICE_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_TRACE_DIR: remarkable-out/llm-trace
    steps:
      - uses: actions/checkout@v4

      # actions/checkout inside a container image doesn't run as the image's
      # own user; git refuses to touch $GITHUB_WORKSPACE until told it's safe.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Export optional env vars
        run: |
          echo "REMARKABLE_FOLDER=${{ inputs.remarkable_folder }}" >> "$GITHUB_ENV"
          echo "REMARKABLE_KEEP_DAYS=${{ inputs.remarkable_keep_days }}" >> "$GITHUB_ENV"
          echo "REMARKABLE_MAX_PENDING=${{ inputs.remarkable_max_pending }}" >> "$GITHUB_ENV"
          if [ -n "${{ inputs.remarkable_archive_folder }}" ]; then echo "REMARKABLE_ARCHIVE_FOLDER=${{ inputs.remarkable_archive_folder }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ inputs.openrouter_model }}" ]; then echo "OPENROUTER_MODEL=${{ inputs.openrouter_model }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ inputs.openrouter_ai_model }}" ]; then echo "OPENROUTER_AI_MODEL=${{ inputs.openrouter_ai_model }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ inputs.openrouter_reasoning }}" ]; then echo "OPENROUTER_REASONING=${{ inputs.openrouter_reasoning }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ inputs.openrouter_read_reasoning }}" ]; then echo "OPENROUTER_READ_REASONING=${{ inputs.openrouter_read_reasoning }}" >> "$GITHUB_ENV"; fi

      - name: Install rmapi
        run: |
          curl -sSL "https://github.com/ddvk/rmapi/releases/download/v0.0.35/rmapi-linux-amd64.tar.gz" | tar -xz -C /usr/local/bin rmapi
          rmapi version || true

      - name: Install engine + remarkable-gtd
        # A ref override must replace the [device] extra, not add to it, or pip
        # sees two conflicting URLs for remarkable-gtd.
        run: |
          if [ -n "${{ inputs.remarkable_gtd_ref }}" ]; then
            pip install 'playwright==1.56.0' \
              "gtd-ci @ git+https://github.com/charlesbaynham/gtd-engine@${GTD_ENGINE_REF}#subdirectory=ci" \
              "gtd-mcp @ git+https://github.com/charlesbaynham/gtd-engine@${GTD_ENGINE_REF}#subdirectory=mcp" \
              "gtd-remarkable @ git+https://github.com/charlesbaynham/gtd-engine@${GTD_ENGINE_REF}#subdirectory=remarkable" \
              "remarkable-gtd @ git+https://github.com/charlesbaynham/remarkable-gtd@${{ inputs.remarkable_gtd_ref }}"
          else
            pip install 'playwright==1.56.0' \
              "gtd-ci @ git+https://github.com/charlesbaynham/gtd-engine@${GTD_ENGINE_REF}#subdirectory=ci" \
              "gtd-mcp @ git+https://github.com/charlesbaynham/gtd-engine@${GTD_ENGINE_REF}#subdirectory=mcp" \
              "gtd-remarkable[device] @ git+https://github.com/charlesbaynham/gtd-engine@${GTD_ENGINE_REF}#subdirectory=remarkable"
          fi

      - name: Process device sheets
        run: |
          TODAY="$(TZ=${{ inputs.vault_tz }} date +%F)"
          export TODAY
          python -m gtd_remarkable process --vault . --work-dir remarkable-out --today "$TODAY" --commit-message-file /tmp/commit-msg.txt

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed, skipping commit."
          else
            git config user.name "GTD CI"
            git config user.email "gtd-ci@users.noreply.github.com"
            git add -A
            git commit -F /tmp/commit-msg.txt
            for attempt in 1 2 3; do
              git push && exit 0
              echo "push rejected, rebasing (attempt $attempt)"
              git pull --rebase
            done
            exit 1
          fi

      - name: Publish today's sheet
        run: |
          TODAY="$(TZ=${{ inputs.vault_tz }} date +%F)"
          export TODAY
          python -m gtd_remarkable publish --vault . --work-dir remarkable-out --today "$TODAY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remarkable-out
          path: remarkable-out/
          retention-days: 14
