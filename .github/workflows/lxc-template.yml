# The Proxmox LXC template for gtd-mcp, built and released from THIS repo.
#
# The image is generic — it carries no vault URL, no branch and no caller list
# — so there is one template for every deployment, and a deployment configures
# it from /data/config.env on its own state volume. That is why this builds
# here rather than in each vault: before, a vault built its own image only to
# bake three lines of deployment.nix into it.
#
# Path-filtered: the template filename carries the commit sha, so an unfiltered
# build would republish — and therefore redeploy every container running it —
# on every unrelated commit, a docs typo included.
#
# It also runs on pull requests, where it builds but does not publish (the
# reusable workflow releases only from the release branch). Without that, a
# flake that does not evaluate is found *after* merge, and what is downstream
# of a merge here is an unattended deploy.
#
# ⚠️ The two `paths:` lists must stay identical. Actions does not support YAML
# anchors, so this is duplication the format forces.
name: Build gtd-mcp LXC template

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - ci/**
      - mcp/**
      - nix/**
      - .github/workflows/lxc-template.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - ci/**
      - mcp/**
      - nix/**
      - .github/workflows/lxc-template.yml
  workflow_dispatch:

jobs:
  lxc-template:
    permissions:
      contents: write
    uses: charlesbaynham/nix-proxmox-cattle/.github/workflows/build-template.yml@v1
    with:
      release_branch: main
